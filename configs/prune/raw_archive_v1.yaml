protocol_name: raw_archive_v1

steps:
  - remove_session:
      files_to_remove:
        - sub-05_ses-04_task-Down_run-01_raw
        - sub-P008_ses-S001_task-Default_run-001_emg_kraken
        - sub-P008_ses-S002_task-Default_run-001_emg_kraken
        - sub-P008_ses-S003_task-Default_run-001_emg_kraken

  - signal_split:
      signal: emg

  - protocol_definer:
      cuttoff_dates:
        - 2025-11-21

  - signal_unwarp: {}

  - analogue_filter:
      btype: bandpass
      cutoff: [20.0, 500.0]
      order: 1

  - marker_unification:
      source_schemas:
        1:
          phase_pos: 0
          movement_slice: [3, 5]
          phase_map:
            1: "cue"
            2: "prep"
            3: "move"
            4: "return"
            5: "iti"
          movement_groups:
            "open hand": [1, 2, 7]
            "close hand": [3, 4, 5, 6, 8, 15, 16]
            "rotate wrist right": [11, 12]
            "rotate wrist left": [13, 14]
            "pinch": [17]
          special_triggers:
            9701: "resting state, eyes open"
            9702: "resting state, eyes closed"
            8888: "start LabRecorder"
            8899: "experiment finished"
            9999: "test marker"
        2:
          phase_pos: 0
          movement_slice: [3, 5]
          phase_map:
            1: "cue"
            3: "prep"
            5: "move"
            7: "return"
            9: "iti"
          movement_groups:
            "open hand": [1]
            "close hand": [2, 3, 10, 11]
            "rotate wrist right": [4, 5]
            "rotate wrist left": [8, 9]
            "pinch": [12]
          special_triggers:
            9701: "resting state, eyes open"
            9702: "resting state, eyes closed"
            8888: "start LabRecorder"
            8899: "experiment finished"
            9999: "test marker"
      target:
        phases:
          "undefined": 0
          "cue": 1
          "prep": 2
          "move": 3
          "return": 4
          "iti": 5
          "resting state, eyes open": 6
          "resting state, eyes closed": 7
          "start LabRecorder": 8
          "experiment finished": 9
          "test marker": 10
        movements:
          "undefined": 0
          "open hand": 1
          "close hand": 2
          "rotate wrist right": 3
          "rotate wrist left": 4
          "pinch": 5

  - build_epochs:
      tmin: -0.5
      tmax: 5.0

  - ttv_split:
      train_ratio: 0.7
      val_ratio: 0.15
      test_ratio: 0.15
      user_balance: true

export:
  - dataset:
      fmt: .fif
      zip_groups: true
